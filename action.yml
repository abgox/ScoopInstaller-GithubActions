name: Bucket Minion
description: Set of actions to automate Scoop bucket maintenance.
author: ScoopInstaller Maintainers
runs:
  using: composite
  steps:
    - name: Cache Scoop
      uses: actions/cache@v6
      with:
        path: ~/SCOOP
        key: Scoop

    - name: Run action.ps1
      shell: pwsh
      run: ${{ github.action_path }}\action.ps1

branding:
  icon: package
  color: purple
